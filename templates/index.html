<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Canlı Transkript</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; margin: 0; background: #f6f7f9; color: #1a2733; }
  header { background: #fff; border-bottom: 1px solid #e3e6ea; padding: 14px 24px; display: flex; align-items: center; gap: 16px; }
  header h1 { font-size: 17px; margin: 0; font-weight: 600; }
  .badge { font-size: 12px; padding: 3px 10px; border-radius: 99px; background: #eef1f4; color: #5a6674; }
  .badge.on { background: #e6f6ea; color: #1c7c33; }
  .top { max-width: 760px; margin: 24px auto 0; padding: 0 20px; }
  #stopBtn { width: 100%; padding: 14px; border: 0; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; background: #e5484d; color: #fff; }
  #stopBtn.started-start { background: #1c7c33; }
  #stopBtn:disabled { background: #c9cfd6; cursor: default; }
  .langrow { display: flex; gap: 10px; align-items: center; margin: 12px 0; font-size: 13px; color: #5a6674; }
  .pill { border: 1px solid #d7dbe1; border-radius: 99px; padding: 4px 12px; background: #fff; }
  #live { font-size: 12px; color: #8a93a0; text-align: right; }
  .card { max-width: 760px; margin: 16px auto; padding: 0 20px; }
  #transcript { background: #fff; border: 1px solid #e3e6ea; border-radius: 12px; min-height: 300px; max-height: 55vh; overflow-y: auto; padding: 18px 22px; }
  .seg { display: flex; gap: 12px; margin-bottom: 14px; }
  .t { color: #4287f5; font-size: 12px; font-family: Consolas, monospace; flex: 0 0 52px; padding-top: 2px; }
  .x { font-size: 14px; line-height: 1.5; }
  .empty { color: #9aa3ae; font-size: 13px; text-align: center; padding: 60px 0; }
  footer { max-width: 760px; margin: 18px auto 40px; padding: 0 20px; display: flex; gap: 10px; }
  button.act { display: flex; align-items: center; gap: 8px; padding: 10px 18px; border-radius: 10px; border: 1px solid #d7dbe1; background: #fff; font-size: 14px; cursor: pointer; }
  button.act:hover { background: #f0f3f6; }
  .spacer { flex: 1; }
</style>
</head>
<body>
<header>
  <h1>📼 Videoyu Metne Dönüştür — Transkript</h1>
  <span class="badge" id="badge">OTHER</span>
  <span style="margin-left:auto" id="live">● kapalı</span>
</header>

<div class="top">
  <button id="stopBtn">▶ Başlat</button>
  <div class="langrow">
    <span>Language:</span>
    <span class="pill">🇹🇷 TR</span>
    <span id="stat">— paragraf</span>
  </div>
</div>

<div class="card">
  <div id="transcript"><div class="empty">Başlat'a basınca bilgisayar sesi buradan akmaya başlar…</div></div>
</div>

<footer>
  <button class="act" onclick="copyAll()">📋 Copy</button>
  <select id="fmt" class="act" style="padding:10px 8px">
    <option value="doc">.doc (Word)</option>
    <option value="txt">.txt (düz metin)</option>
  </select>
  <button class="act" id="expBtn">⬇ Export</button>
  <span class="spacer"></span>
  <button class="act" onclick="clearAll()">🗑 Temizle</button>
</footer>

<script>
const transcript = document.getElementById('transcript');
const badge = document.getElementById('badge');
const live = document.getElementById('live');
const stopBtn = document.getElementById('stopBtn');
const stat = document.getElementById('stat');
let running = false, count = 0;

function fmt(i) { return i ? 'on' : ''; }

async function refresh() {
  const s = await (await fetch('/api/status')).json();
  running = s.running; count = s.count;
  badge.textContent = running ? 'CANLI' : 'DURDU';
  badge.className = 'badge ' + fmt(running);
  live.textContent = running ? '● canlı' : '○ kapalı';
  live.style.color = running ? '#1c7c33' : '#8a93a0';
  stopBtn.textContent = running ? '■ Stop' : '▶ Başlat';
  stopBtn.classList.toggle('started-start', running);
  stat.textContent = count + ' paragraf';
}

stopBtn.onclick = async () => {
  await fetch('/api/' + (running ? 'stop' : 'start'), {method: 'POST'});
  setTimeout(refresh, 400);
};

async function copyAll() {
  const t = await (await fetch('/api/text')).text();
  await navigator.clipboard.writeText(t);
  alert('Kopyalandı (' + t.length + ' kar.)');
}

document.getElementById('expBtn').onclick = () => {
  location.href = document.getElementById('fmt').value === 'doc' ? '/api/docx' : '/api/text';
};

async function clearAll() {
  if (!confirm('Tüm transkript silinsin mi?')) return;
  await fetch('/api/clear', {method: 'POST'});
  transcript.innerHTML = '<div class="empty">Temizlendi.</div>';
  refresh();
}

function addSeg(it) {
  if (transcript.querySelector('.empty')) transcript.innerHTML = '';
  const div = document.createElement('div');
  div.className = 'seg';
  div.innerHTML = '<span class="t">' + it.time + '</span><span class="x"></span>';
  div.querySelector('.x').textContent = it.text;
  transcript.appendChild(div);
  transcript.scrollTop = transcript.scrollHeight;
}

function listen() {
  const es = new EventSource('/events');
  es.onmessage = (e) => {
    try { JSON.parse(e.data).items.forEach(addSeg); } catch {}
  };
  es.onerror = () => { es.close(); setTimeout(listen, 2000); };
}

refresh(); setInterval(refresh, 3000); listen();
</script>
</body>
</html>
